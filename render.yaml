# Hackathon-only free deployment: one web instance + one PostgreSQL instance.
# Render Free Postgres expires 30 days after creation; it is not permanent storage.
services:
  - type: web
    name: agenttrust-gateway
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && DATABASE_URL=postgresql://build:build@127.0.0.1:5432/agenttrust_build npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agenttrust-gateway-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: agenttrust-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        value: ""
      - key: PAYPAL_WEBHOOK_ID
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_RETURN_URL
        value: ""
      - key: PAYPAL_CANCEL_URL
        value: ""
      - key: PAYPAL_WEBHOOK_URL
        value: ""

databases:
  - name: agenttrust-gateway-db
    plan: free
    region: singapore
    databaseName: agenttrust
    user: agenttrust
    ipAllowList: []
