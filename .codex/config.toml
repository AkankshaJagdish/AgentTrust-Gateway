# Project-level Codex defaults. Supply secrets as environment variables, never inline.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Optional remote development MCPs. Project configuration loads only for trusted repos.
[mcp_servers.paypal]
url = "https://mcp.sandbox.paypal.com/http"
enabled = true
# Fail closed until the remote tool catalogue is inspected and exact read-only names are allow-listed.
enabled_tools = []

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
